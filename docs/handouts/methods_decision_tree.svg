<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 605" role="img" aria-label="Decision tree for choosing between a lottery, difference-in-differences, regression discontinuity and matching. Start by asking whether the evaluation is designed before or after the programme. Before: randomise if ethical and feasible. Otherwise, or after: difference-in-differences needs before and after data and similar earlier paths; regression discontinuity needs a score cut-off; matching needs recorded characteristics that explain who took part; otherwise there is no credible comparison yet." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.mtree{font-family:"Noto Kufi Arabic","Segoe UI",Arial,sans-serif;}
svg{width:100%;height:auto;display:block;margin:0 auto}
.mt-line{fill:none;stroke:#063360;stroke-width:2.6}
.mt-q rect{fill:#E4EBF3;stroke:#215a9e;stroke-width:2.5}
.mt-m rect{fill:#215a9e;stroke:#063360;stroke-width:2.5}
.mt-x rect{fill:#F8E9EA;stroke:#B8272C;stroke-width:2.5}
.mt-t{font-size:18px;fill:#111418;text-anchor:middle}
.mt-m .mt-t{fill:#fff;font-weight:700}
.mt-m .mt-s{fill:#E4EBF3;font-size:15px;font-weight:400}
.mt-x .mt-s{font-size:15px;fill:#545860}
.mt-pill rect{fill:#fff;stroke:#063360;stroke-width:2}
.mt-pill text{font-size:17px;font-weight:700;fill:#063360;text-anchor:middle}
.mtree[data-interactive] .mt-node,.mtree[data-interactive] .mt-edge{opacity:.22;transition:opacity .3s}
.mtree[data-interactive] .mt-node.on,.mtree[data-interactive] .mt-edge.on{opacity:1}
.mtree[data-interactive] .mt-node.current rect{stroke:#063360;stroke-width:5;fill:#cfe0f3}
.mtree[data-interactive] .mt-node.result rect{stroke:#111418;stroke-width:6}
.mtree[data-interactive] .mt-edge.taken{opacity:1}
.mtree[data-interactive] .mt-edge.taken .mt-line{stroke:#215a9e;stroke-width:6;marker-end:url(#mt-arrow-on)}
.mtree[data-interactive] .mt-edge.taken .mt-pill rect{fill:#215a9e;stroke:#215a9e}
.mtree[data-interactive] .mt-edge.taken .mt-pill text{fill:#fff}
.mtree[data-interactive] .mt-node.on rect{stroke-width:3.5}
.mtree[data-interactive] .mt-edge.next{opacity:1;cursor:pointer}
.mtree[data-interactive] .mt-edge.next .mt-pill rect{fill:#063360}
.mtree[data-interactive] .mt-edge.next .mt-pill text{fill:#fff}
.mtree-ctl{display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center;margin-top:6px}
.mtree-q{font-size:26px;line-height:1.25;color:#063360;font-weight:700}
.mtree-msg{font-size:22px;line-height:1.3;color:#111418;grid-column:1/-1}
.mtree-msg strong{color:#063360}
.mtree-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-size:22px;padding:6px 20px;border:2px solid #063360;background:#fff;color:#063360;border-radius:6px;cursor:pointer}
button.mt-go{background:#215a9e;color:#fff;border-color:#215a9e}
button:disabled{opacity:.35;cursor:default}
</style><defs><marker id="mt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#063360"/></marker><marker id="mt-arrow-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#215a9e"/></marker></defs><g id="e-q0>q1" class="mt-edge" data-from="q0" data-to="q1" data-label="Before"><path class="mt-line" d="M370 39 L180 39 L180 107" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="247.0" y="24" width="86" height="30" rx="6"/><text x="290" y="45">Before</text></g></g><g id="e-q0>q2" class="mt-edge" data-from="q0" data-to="q2" data-label="After"><path class="mt-line" d="M830 39 L1020 39 L1020 108" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="867.0" y="24" width="86" height="30" rx="6"/><text x="910" y="45">After</text></g></g><g id="e-q1>m_rct" class="mt-edge" data-from="q1" data-to="m_rct" data-label="Yes"><path class="mt-line" d="M100 203 L100 525" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="72.0" y="350" width="56" height="30" rx="6"/><text x="100" y="371">Yes</text></g></g><g id="e-q1>qcut" class="mt-edge" data-from="q1" data-to="qcut" data-label="No"><path class="mt-line" d="M340 155 L520 155 L520 277" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="402.0" y="140" width="56" height="30" rx="6"/><text x="430" y="161">No</text></g></g><g id="e-q2>q3" class="mt-edge" data-from="q2" data-to="q3" data-label="Yes"><path class="mt-line" d="M1020 216 L1020 260" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="1030.0" y="223" width="56" height="30" rx="6"/><text x="1058" y="244">Yes</text></g></g><g id="e-q2>qcut" class="mt-edge" data-from="q2" data-to="qcut" data-label="No"><path class="mt-line" d="M850 166 L520 166 L520 277" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="752.0" y="151" width="56" height="30" rx="6"/><text x="780" y="172">No</text></g></g><g id="e-q3>m_did" class="mt-edge" data-from="q3" data-to="m_did" data-label="Yes"><path class="mt-line" d="M1020 368 L1020 525" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="992.0" y="485" width="56" height="30" rx="6"/><text x="1020" y="506">Yes</text></g></g><g id="e-q3>qcut" class="mt-edge" data-from="q3" data-to="qcut" data-label="No"><path class="mt-line" d="M850 314 L680 314" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="737.0" y="299" width="56" height="30" rx="6"/><text x="765" y="320">No</text></g></g><g id="e-qcut>m_rdd" class="mt-edge" data-from="qcut" data-to="m_rdd" data-label="Yes"><path class="mt-line" d="M360 314 L290 314 L290 525" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="297.0" y="299" width="56" height="30" rx="6"/><text x="325" y="320">Yes</text></g></g><g id="e-qcut>qobs" class="mt-edge" data-from="qcut" data-to="qobs" data-label="No"><path class="mt-line" d="M520 351 L520 395" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="530.0" y="358" width="56" height="30" rx="6"/><text x="558" y="379">No</text></g></g><g id="e-qobs>m_match" class="mt-edge" data-from="qobs" data-to="m_match" data-label="Yes"><path class="mt-line" d="M520 491 L520 525" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="530.0" y="493" width="56" height="30" rx="6"/><text x="558" y="514">Yes</text></g></g><g id="e-qobs>x_none" class="mt-edge" data-from="qobs" data-to="x_none" data-label="No"><path class="mt-line" d="M690 443 L790 443" marker-end="url(#mt-arrow)"/><g class="mt-pill"><rect x="712.0" y="428" width="56" height="30" rx="6"/><text x="740" y="449">No</text></g></g><g id="n-q0" class="mt-node mt-q" data-id="q0"><rect x="370" y="8" width="460" height="62" rx="6"/><text class="mt-t" x="600.0" y="33.5">Are you designing the evaluation</text><text class="mt-t" x="600.0" y="56.5">before or after the programme starts?</text></g><g id="n-q1" class="mt-node mt-q" data-id="q1"><rect x="20" y="107" width="320" height="96" rx="6"/><text class="mt-t" x="180.0" y="138.0">Is it ethical and</text><text class="mt-t" x="180.0" y="161.0">feasible to randomise</text><text class="mt-t" x="180.0" y="184.0">who gets the programme?</text></g><g id="n-q2" class="mt-node mt-q" data-id="q2"><rect x="850" y="108" width="340" height="108" rx="6"/><text class="mt-t" x="1020.0" y="133.5">Do we have before and</text><text class="mt-t" x="1020.0" y="156.5">after data for</text><text class="mt-t" x="1020.0" y="179.5">participants and a</text><text class="mt-t" x="1020.0" y="202.5">comparison group?</text></g><g id="n-q3" class="mt-node mt-q" data-id="q3"><rect x="850" y="260" width="340" height="108" rx="6"/><text class="mt-t" x="1020.0" y="285.5">Did participant and</text><text class="mt-t" x="1020.0" y="308.5">comparison costs follow a</text><text class="mt-t" x="1020.0" y="331.5">similar path before the</text><text class="mt-t" x="1020.0" y="354.5">programme?</text></g><g id="n-qcut" class="mt-node mt-q" data-id="qcut"><rect x="360" y="277" width="320" height="74" rx="6"/><text class="mt-t" x="520.0" y="297.0">Did a score or cut-off</text><text class="mt-t" x="520.0" y="320.0">decide who could take</text><text class="mt-t" x="520.0" y="343.0">part?</text></g><g id="n-qobs" class="mt-node mt-q" data-id="qobs"><rect x="330" y="395" width="360" height="96" rx="6"/><text class="mt-t" x="510.0" y="414.5">Do the recorded</text><text class="mt-t" x="510.0" y="437.5">characteristics explain who</text><text class="mt-t" x="510.0" y="460.5">took part, with nothing</text><text class="mt-t" x="510.0" y="483.5">important missing?</text></g><g id="n-m_rct" class="mt-node mt-m" data-id="m_rct"><rect x="15" y="525" width="170" height="72" rx="6"/><text class="mt-t" x="100.0" y="556.0">Lottery</text><text class="mt-t mt-s" x="100.0" y="578.0">Randomised trial</text></g><g id="n-m_rdd" class="mt-node mt-m" data-id="m_rdd"><rect x="205" y="525" width="170" height="72" rx="6"/><text class="mt-t" x="290.0" y="545.0">Regression</text><text class="mt-t" x="290.0" y="567.0">discontinuity</text><text class="mt-t mt-s" x="290.0" y="589.0">Day 2 Session 2</text></g><g id="n-m_match" class="mt-node mt-m" data-id="m_match"><rect x="425" y="525" width="190" height="72" rx="6"/><text class="mt-t" x="520.0" y="556.0">Matching</text><text class="mt-t mt-s" x="520.0" y="578.0">Day 2 Session 3</text></g><g id="n-m_did" class="mt-node mt-m" data-id="m_did"><rect x="910" y="525" width="220" height="72" rx="6"/><text class="mt-t" x="1020.0" y="545.0">Difference-in-</text><text class="mt-t" x="1020.0" y="567.0">differences</text><text class="mt-t mt-s" x="1020.0" y="589.0">Day 2 Session 1</text></g><g id="n-x_none" class="mt-node mt-x" data-id="x_none"><rect x="790" y="388" width="200" height="110" rx="6"/><text class="mt-t" x="890.0" y="416.0">No credible</text><text class="mt-t" x="890.0" y="438.0">comparison</text><text class="mt-t mt-s" x="890.0" y="460.0">Ask for another</text><text class="mt-t mt-s" x="890.0" y="482.0">design or more data</text></g></svg>